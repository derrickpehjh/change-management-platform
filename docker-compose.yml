# Quick-start: pull from Docker Hub and run the full stack.
#
#   cp .env.example .env        # fill in JWT_SECRET and WEB_ORIGIN
#   docker compose up -d
#
# Web UI:  http://localhost:3001
# API:     http://localhost:4000
# MinIO:   http://localhost:9001  (console, minioadmin / minioadmin)

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: cmp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cmp}
      POSTGRES_DB: cmp
    volumes:
      - cmp_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cmp"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: quay.io/minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - cmp_minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  createbuckets:
    image: quay.io/minio/mc
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${S3_ACCESS_KEY_ID:-minioadmin} ${S3_SECRET_ACCESS_KEY:-minioadmin} &&
      mc mb local/attachments --ignore-existing &&
      echo 'bucket ready'
      "
    restart: "no"

  api:
    image: derrickpehjh/cmp-api:latest
    ports:
      - "4000:4000"
    environment:
      DATABASE_URL: postgresql://cmp:${POSTGRES_PASSWORD:-cmp}@postgres:5432/cmp?schema=public
      PORT: 4000
      JWT_SECRET: ${JWT_SECRET}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3001}
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:9000}
      S3_BUCKET: attachments
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-minioadmin}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-minioadmin}
      AUTH_MODE: ${AUTH_MODE:-mock}
    depends_on:
      postgres:
        condition: service_healthy
      createbuckets:
        condition: service_completed_successfully
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:4000/health/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  seed:
    image: derrickpehjh/cmp-api:latest
    command: npm run seed
    environment:
      DATABASE_URL: postgresql://cmp:${POSTGRES_PASSWORD:-cmp}@postgres:5432/cmp?schema=public
    depends_on:
      api:
        condition: service_healthy
    restart: "no"

  web:
    image: derrickpehjh/cmp-web:latest
    ports:
      - "3001:3000"
    environment:
      API_PROXY_ORIGIN: http://api:4000
    depends_on:
      - api
    restart: on-failure

volumes:
  cmp_pg_data:
  cmp_minio_data:
