# Quick-start: pull from Docker Hub and run the full stack.
#
#   cp .env.example .env        # fill in JWT_SECRET and WEB_ORIGIN
#   docker compose up -d
#
# Web UI:  http://localhost:3001
# API:     http://localhost:4000

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: cmp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cmp}
      POSTGRES_DB: cmp
    volumes:
      - cmp_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cmp"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    image: derrickpehjh/cmp-api:latest
    ports:
      - "4000:4000"
    environment:
      DATABASE_URL: postgresql://cmp:${POSTGRES_PASSWORD:-cmp}@postgres:5432/cmp?schema=public
      PORT: 4000
      JWT_SECRET: ${JWT_SECRET}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3001}
      AUTH_MODE: ${AUTH_MODE:-mock}
      COOKIE_SECURE: ${COOKIE_SECURE:-}
      GITLAB_ISSUER_URL: ${GITLAB_ISSUER_URL:-}
      GITLAB_CLIENT_ID: ${GITLAB_CLIENT_ID:-}
      GITLAB_CLIENT_SECRET: ${GITLAB_CLIENT_SECRET:-}
      GITLAB_CALLBACK_URL: ${GITLAB_CALLBACK_URL:-}
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:4000/health/ready', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  seed:
    image: derrickpehjh/cmp-api:latest
    command: npx ts-node prisma/seed.ts
    environment:
      DATABASE_URL: postgresql://cmp:${POSTGRES_PASSWORD:-cmp}@postgres:5432/cmp?schema=public
    depends_on:
      api:
        condition: service_healthy
    restart: "no"

  web:
    image: derrickpehjh/cmp-web:latest
    ports:
      - "3001:3000"
    environment:
      API_PROXY_ORIGIN: http://api:4000
    depends_on:
      - api
    restart: on-failure

volumes:
  cmp_pg_data:
