version: "3.9"

# Optional: local Postgres/Redis via Docker. Not required — this repo's dev
# setup also works against a plain Homebrew/apt Postgres install (see README).
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: cmp
      POSTGRES_PASSWORD: cmp
      POSTGRES_DB: cmp
    ports:
      - "5432:5432"
    volumes:
      - cmp_pg_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

volumes:
  cmp_pg_data:
