version: "3.9"

# Full-stack compose: postgres + redis + api + web.
# Run from the monorepo root:
#   docker compose -f docker/docker-compose.yml up --build
#
# Env overrides: copy docker/.env.example to docker/.env and edit before running.

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: cmp
      POSTGRES_PASSWORD: cmp
      POSTGRES_DB: cmp
    ports:
      - "5432:5432"
    volumes:
      - cmp_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cmp"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    ports:
      - "4000:4000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://cmp:cmp@postgres:5432/cmp?schema=public
      PORT: 4000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: on-failure

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      # Proxy /api/* server-side to the api container — keeps cookies same-site
      API_PROXY_ORIGIN: http://api:4000
      NEXT_PUBLIC_API_URL: /api
    depends_on:
      - api
    restart: on-failure

volumes:
  cmp_pg_data:
