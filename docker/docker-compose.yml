version: "3.9"

# Full-stack compose: postgres + minio + api + web.
# Run from the monorepo root:
#   docker compose -f docker/docker-compose.yml up --build
#
# Env overrides: copy docker/.env.example to docker/.env and edit before running.

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: cmp
      POSTGRES_PASSWORD: cmp
      POSTGRES_DB: cmp
    ports:
      - "5432:5432"
    volumes:
      - cmp_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cmp"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - cmp_minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  createbuckets:
    image: minio/mc
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb local/attachments --ignore-existing &&
      echo 'bucket ready'
      "
    restart: "no"

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    ports:
      - "4000:4000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://cmp:cmp@postgres:5432/cmp?schema=public
      PORT: 4000
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: http://localhost:9000
      S3_BUCKET: attachments
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
    depends_on:
      postgres:
        condition: service_healthy
      createbuckets:
        condition: service_completed_successfully
    restart: on-failure

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    ports:
      - "3001:3000"
    env_file:
      - .env
    environment:
      # Proxy /api/* server-side to the api container — keeps cookies same-site
      API_PROXY_ORIGIN: http://api:4000
    depends_on:
      - api
    restart: on-failure

volumes:
  cmp_pg_data:
  cmp_minio_data:
